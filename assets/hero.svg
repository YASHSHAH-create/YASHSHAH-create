    <stop offset="0" stop-color="#FF4A1C" stop-opacity="0.34"/><stop offset="0.55" stop-color="#FF4A1C" stop-opacity="0.07"/><stop offset="1" stop-color="#FF4A1C" stop-opacity="0"/>
