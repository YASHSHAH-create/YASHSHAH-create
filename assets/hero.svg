<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Yash Shah. Full-stack and mobile engineer building Paymm. Production status: Paymm live, Paymm Captain live, ride dispatch live, recharge engine live, HeyMilo in build.">

<defs>
