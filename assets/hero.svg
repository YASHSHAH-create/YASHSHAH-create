</defs>
<style>
  .dot{animation:pulse 2.4s ease-in-out infinite}
  .d1{animation-delay:.3s}.d2{animation-delay:.6s}.d3{animation-delay:.9s}.d4{animation-delay:1.2s}
  .glow{animation:breathe 7s ease-in-out infinite}
  .cur{animation:blink 1s steps(1) infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.dot,.glow,.cur{animation:none}}
</style>
